<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Usuários</title>
</head>
<body>

    <h1>Lista de Usuários</h1>

        {%for x in usuarios%}
            <ul>
                <li>Nome: {{x.nome}}</li>
                <li>Matrícula:{{x.matricula}}</li>
                <li>Idade: {{x.idade}}</li>
                <li>Cidade: {{x.cidade}}</li>
            </ul>
        {%endfor%}

    <a href="/">
        Voltar para página inicial
    </a>

</body>
</html>
