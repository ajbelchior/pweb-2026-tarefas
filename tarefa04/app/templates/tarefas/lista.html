<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Lista de Tarefas</title>

    <style>

        body{
            font-family: Arial;
            background:#f4f4f4;
            margin:40px;
        }

        h1{
            text-align:center;
        }

        table{
            width:100%;
            border-collapse:collapse;
            background:white;
        }

        th,td{
            border:1px solid #ccc;
            padding:12px;
            text-align:center;
        }

        th{
            background:#333;
            color:white;
        }

        .atrasada{
            background:#ffb3b3;
        }

        .normal{
            background:#d9ffd9;
        }

    </style>

</head>

<body>

<h1>Lista de Tarefas</h1>

<table>

<tr>
    <th>Tarefa</th>
    <th>Status</th>
    <th>Prazo</th>
</tr>

{% for tarefa in tarefas %}

<tr class="{% if tarefa.prazo < hoje and tarefa.status != 'Concluída' %}atrasada{% else %}normal{% endif %}">

    <td>{{ tarefa.nome }}</td>

    <td>{{ tarefa.status }}</td>

    <td>{{ tarefa.prazo }}</td>

</tr>

{% endfor %}

</table>

</body>
</html>
